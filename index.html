<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>📚Biblioteca</h1>
        <p>Gerenciamento simples de livros, usuários e empréstimos</p>
    </header>

    <nav class="navbar">
        <div class="nav-container">
            <button class="nav-btn active" data-page="livros" onclick="navegarPara('livros')">📚 Livros</button>
            <button class="nav-btn" data-page="usuarios" onclick="navegarPara('usuarios')">👤 Usuários</button>
            <button class="nav-btn" data-page="emprestimos" onclick="navegarPara('emprestimos')">📖 Empréstimos</button>
        </div>
    </nav>

    <main class="container">

        <!-- Página 1: Livros -->
        <section id="page-livros" class="page-content active">
            <h2>📚 Cadastro de Livros</h2>
            <form id="form-livro">
                <div class="form-group">
                    <label for="titulo">Título do Livro:</label>
                    <input type="text" id="titulo" placeholder="Ex: Dom Casmurro" required>
                </div>
                <div class="form-group">
                    <label for="autor">Autor:</label>
                    <input type="text" id="autor" placeholder="Ex: Machado de Assis" required>
                </div>
                <div class="form-group">
                    <label for="categoria">Gênero / Categoria:</label>
                    <input type="text" id="categoria" placeholder="Ex: Romance, Ficção..." required>
                </div>
                <div class="form-group">
                    <label for="ano">Ano de Publicação:</label>
                    <input type="number" id="ano" placeholder="Ex: 1899" required>
                </div>
                <button type="submit" class="btn">Cadastrar Livro</button>
            </form>

            <h3>Livros Cadastrados</h3>

            <!-- Área do Filtro de Pesquisa -->
            <div class="search-box">
                <div class="form-group search-input">
                    <label for="busca-livros">🔍 Buscar Livro:</label>
                    <input type="text" id="busca-livros" placeholder="Digite para filtrar..." oninput="filtrarLivros()">
                </div>
                <div class="form-group search-select">
                    <label for="filtro-campo">Filtrar por:</label>
                    <select id="filtro-campo" onchange="filtrarLivros()">
                        <option value="todos">Todos os campos</option>
                        <option value="categoria">Gênero</option>
                        <option value="autor">Autor</option>
                        <option value="ano">Ano de Publicação</option>
                        <option value="titulo">Título</option>
                    </select>
                </div>
            </div>

            <div id="lista-livros" class="cards-list"></div>
        </section>

        <!-- Página 2: Usuários -->
        <section id="page-usuarios" class="page-content">
            <h2>👤 Cadastro de Usuários</h2>
            <form id="form-usuario">
                <div class="form-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" placeholder="Ex: João Silva" required>
                </div>
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" placeholder="Ex: joao@email.com" required>
                </div>
                <div class="form-group">
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" placeholder="Ex: (11) 99999-9999" required>
                </div>
                <button type="submit" class="btn">Cadastrar Usuário</button>
            </form>

            <h3>Usuários Cadastrados</h3>
            <div id="lista-usuarios" class="cards-list"></div>
        </section>

        <!-- Página 3: Empréstimos -->
        <section id="page-emprestimos" class="page-content">
            <h2>📖 Registrar Empréstimo</h2>
            <form id="form-emprestimo">
                <div class="form-group">
                    <label for="select-usuario">Selecione o Usuário:</label>
                    <select id="select-usuario" required>
                        <option value="">-- Selecione o Usuário --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="select-livro">Selecione o Livro:</label>
                    <select id="select-livro" required>
                        <option value="">-- Selecione o Livro --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="data-devolucao">Data Prevista de Devolução:</label>
                    <input type="date" id="data-devolucao" required>
                </div>
                <button type="submit" class="btn">Registrar Empréstimo</button>
            </form>

            <h3>Histórico de Empréstimos</h3>
            <div id="lista-emprestimos" class="cards-list"></div>
        </section>

    </main>

    <footer>
        <p>Sistema de Biblioteca - Projeto Educacional</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
